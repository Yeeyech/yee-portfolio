<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面未找到 | 叶春福 Yee</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23080f20'/%3E%3Ctext x='16' y='22' font-family='Arial' font-size='15' fill='%23bacefc' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
<style>
  :root{ --bg:#080f20; --fg:#f3f6ff; --accent:#bacefc; --muted:#a5b1ca; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg);
        font-family:"Space Grotesk",system-ui,"PingFang SC","Microsoft YaHei",sans-serif; padding:24px; text-align:center; }
  .code{ font-size:clamp(64px,18vw,160px); line-height:1; font-weight:700; letter-spacing:-.04em; margin:0;
         background:linear-gradient(120deg,var(--accent),#ff7a5c); -webkit-background-clip:text; background-clip:text; color:transparent; }
  h1{ font-size:1.25rem; font-weight:600; margin:8px 0 4px; }
  p{ color:var(--muted); max-width:44ch; margin:12px auto 28px; line-height:1.6; }
  a{ display:inline-block; padding:12px 26px; border-radius:999px; border:1px solid var(--accent); color:var(--accent);
     text-decoration:none; font-weight:600; transition:background .2s, color .2s; }
  a:hover{ background:var(--accent); color:#080f20; }
</style>
</head>
<body>
  <div>
    <p class="code">404</p>
    <h1>页面未找到</h1>
    <p>你访问的页面不存在或已被移动。返回作品集首页继续浏览。</p>
    <a href="./">← 返回首页</a>
  </div>
</body>
</html>
